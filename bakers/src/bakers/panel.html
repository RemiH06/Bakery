<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cola de Bakery</title>
<style>
:root {
  --fondo: #f6f3ee; --tarjeta: #ffffff; --texto: #1f1c18; --tenue: #6b645b; --borde: #e2dcd2;
  --acento: #b5481f; --acento-texto: #ffffff;
  --pendiente: #6b645b; --bajado: #1f6aa5; --clasificar: #7a4bb0; --analizado: #2f7d4a; --fallido: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #16130f; --tarjeta: #211d18; --texto: #eee8df; --tenue: #a39a8e; --borde: #3a332b;
    --acento: #e07a4f; --acento-texto: #16130f;
    --pendiente: #a39a8e; --bajado: #6fb0e8; --clasificar: #b892e6; --analizado: #6cc58e; --fallido: #f08a82;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 system-ui, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.4rem; margin: 0 0 4px; }
h2 { font-size: 1.05rem; margin: 0 0 10px; }
section { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; margin: 14px 0; }
.tenue { color: var(--tenue); }
.fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.datos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.dato b { display: block; font-size: 1.25rem; }
.dato span { color: var(--tenue); font-size: .85rem; }
textarea, input, select { width: 100%; font: inherit; color: var(--texto); background: var(--fondo);
  border: 1px solid var(--borde); border-radius: 8px; padding: 10px; }
textarea { min-height: 110px; resize: vertical; }
button { font: inherit; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
button.primario { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); font-weight: 600; }
button[aria-pressed="true"] { border-color: var(--acento); box-shadow: inset 0 0 0 1px var(--acento); }
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.pila { display: grid; gap: 8px; }
.insignia { font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.e-pendiente { color: var(--pendiente); } .e-bajado { color: var(--bajado); } .e-clasificar { color: var(--clasificar); }
.e-analizado { color: var(--analizado); } .e-fallido { color: var(--fallido); }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { border-top: 1px solid var(--borde); padding: 10px 0; display: grid; gap: 3px; }
ul.items li:first-child { border-top: 0; }
a { color: var(--acento); overflow-wrap: anywhere; }
.error { color: var(--fallido); font-size: .88rem; overflow-wrap: anywhere; }
pre { margin: 6px 0 0; padding: 10px; background: var(--fondo); border-radius: 8px; overflow-x: auto;
  font-size: .8rem; line-height: 1.35; max-height: 360px; }
details summary { cursor: pointer; padding: 4px 0; }
#aviso { min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <h1>Cola de Bakery</h1>
  <p class="tenue" id="actualizado">Cargando…</p>

  <section aria-labelledby="t-resumen">
    <h2 id="t-resumen">Ahora</h2>
    <div class="datos" id="resumen"></div>
  </section>

  <section aria-labelledby="t-agregar">
    <h2 id="t-agregar">Agregar enlaces</h2>
    <form id="agregar" class="pila">
      <label for="texto" class="tenue">Pega uno o varios, uno por renglón. Lo que va antes del enlace ("Osiris: https://…") se guarda como etiqueta, y un renglón "# Política" cambia la sección.</label>
      <textarea id="texto" required placeholder="https://www.instagram.com/reel/…"></textarea>
      <label for="seccion" class="tenue">Sección (opcional; es la pista del clasificador)</label>
      <input id="seccion" list="secciones" autocomplete="off">
      <datalist id="secciones"></datalist>
      <div class="fila"><button class="primario" type="submit">Agregar a la cola</button><span id="aviso" role="status"></span></div>
    </form>
  </section>

  <section aria-labelledby="t-fallidos" id="caja-fallidos" hidden>
    <h2 id="t-fallidos">Fallidos</h2>
    <div class="fila" id="reintentos"></div>
  </section>

  <section aria-labelledby="t-piezas">
    <h2 id="t-piezas">Piezas</h2>
    <div class="pila">
      <div class="fila" id="filtros" role="group" aria-label="Filtrar por estado"></div>
      <input id="buscar" type="search" placeholder="Buscar por código, clase, sección, nota o error" aria-label="Buscar">
      <p class="tenue" id="cuantas"></p>
      <ul class="items" id="items"></ul>
    </div>
  </section>

  <section aria-labelledby="t-registro">
    <h2 id="t-registro">Registro</h2>
    <div id="registro"></div>
  </section>
</main>
<script>
"use strict";
const ESTADOS = ["fallido", "bajado", "clasificar", "pendiente", "analizado"];
let ultimo = null, filtro = "todos";

function el(tag, props = {}, ...hijos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const h of hijos) if (h != null && h !== "") n.append(h);
  return n;
}
const enlace = (url, texto) => /^https?:\/\//.test(url || "") ? el("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, texto) : texto;
const hora = (iso) => iso ? new Date(iso).toLocaleString("es-MX", { dateStyle: "short", timeStyle: "short" }) : "—";

async function api(ruta, cuerpo) {
  const r = await fetch(ruta, cuerpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) } : {});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}

function pintarResumen(d) {
  const r = d.resumen, c = r.conteo;
  const pausa = r.proximo && new Date(r.proximo) > new Date() ? `${r.motivo}, sigue ${hora(r.proximo)}` : "bajando";
  const datos = [
    [d.marcha, "marcha (analizar solo en alta)"],
    [`${r.bajados_hoy} de ${d.tope}`, "bajados hoy"],
    [pausa, "descargas"],
    [`${d.libre_gb} GB`, `libres (mínimo ${d.min_libre})`],
    ...ESTADOS.map(e => [c[e] || 0, e]),
  ];
  document.getElementById("resumen").replaceChildren(...datos.map(([v, t]) => el("div", { class: "dato" }, el("b", {}, String(v)), el("span", {}, t))));
}

function pintarFallidos(d) {
  const caja = document.getElementById("caja-fallidos"), n = d.resumen.conteo.fallido || 0;
  caja.hidden = !n;
  const botones = [["todos", null], ["enlaces rotos", "enlace"], ["bloqueos", "bloqueo"], ["análisis", "analisis"]];
  document.getElementById("reintentos").replaceChildren(el("span", { class: "tenue" }, `Reintentar ${n}:`),
    ...botones.map(([t, tipo]) => el("button", { type: "button", onclick: async () => {
      try { const res = await api("/api/reintentar", { tipo }); avisar(`${res.reintentados} de vuelta a la cola`); cargar(); }
      catch (e) { avisar(e.message, true); }
    } }, t)));
}

function pintarFiltros(d) {
  const c = d.resumen.conteo, total = d.items.length;
  document.getElementById("filtros").replaceChildren(...[["todos", total], ...ESTADOS.map(e => [e, c[e] || 0])].map(([e, n]) =>
    el("button", { type: "button", "aria-pressed": String(filtro === e), onclick: () => { filtro = e; pintar(); } }, `${e} ${n}`)));
}

function pintarItems(d) {
  const q = document.getElementById("buscar").value.trim().toLowerCase();
  const orden = Object.fromEntries(ESTADOS.map((e, i) => [e, i]));
  const lista = d.items.map((it, i) => ({ ...it, i }))
    .filter(it => filtro === "todos" || it.estado === filtro)
    .filter(it => !q || [it.clave, it.clase, it.seccion, it.etiqueta, it.nota, it.error, it.url].some(x => (x || "").toLowerCase().includes(q)))
    .sort((a, b) => (orden[a.estado] - orden[b.estado]) || (b.i - a.i));  // lo más nuevo primero
  document.getElementById("cuantas").textContent = `${lista.length} piezas`;
  document.getElementById("items").replaceChildren(...lista.slice(0, 300).map(it => {
    const pista = [it.seccion, it.etiqueta].filter(Boolean).join(" / ");
    const intentos = [it.intentos ? `${it.intentos} bloqueos` : "", it.intentos_analisis ? `${it.intentos_analisis} análisis fallidos` : ""].filter(Boolean).join(", ");
    return el("li", {},
      el("div", { class: "fila" }, el("span", { class: `insignia e-${it.estado}` }, it.estado), enlace(it.url, it.clave),
        it.clase ? el("span", { class: "insignia" }, it.clase) : null),
      pista ? el("span", { class: "tenue" }, `Sección: ${pista}`) : null,
      it.nota ? el("span", { class: "tenue" }, `Nota: ${it.nota}`) : null,
      intentos ? el("span", { class: "tenue" }, intentos) : null,
      it.error ? el("span", { class: "error" }, it.error) : null);
  }));
  if (lista.length > 300) document.getElementById("cuantas").textContent += " (se muestran 300; filtra o busca)";
}

function pintarRegistro(d) {
  // Al refrescar, lo que estaba abierto sigue abierto
  const abiertos = new Set([...document.querySelectorAll("#registro details[open]")].map(x => x.dataset.nombre));
  const caja = (nombre, titulo, texto) => {
    const props = { "data-nombre": nombre };
    if (abiertos.has(nombre)) props.open = "";
    return el("details", props, el("summary", {}, titulo), el("pre", {}, texto));
  };
  const bloques = Object.entries(d.logs).map(([n, lineas]) => caja(n, `${n}.log`, lineas.join("\n") || "vacío"));
  const errores = d.errores.map(e => `${hora(e.ts)}  ${e.tipo}  ${e.clave}\n  ${e.error.slice(-240)}`).join("\n");
  bloques.push(caja("errores", `errores de descarga (${d.errores.length} recientes)`, errores || "ninguno"));
  document.getElementById("registro").replaceChildren(...bloques);
}

function pintar() {
  if (!ultimo) return;
  pintarResumen(ultimo); pintarFallidos(ultimo); pintarFiltros(ultimo); pintarItems(ultimo);
  const secciones = [...new Set(ultimo.items.map(i => i.seccion).filter(Boolean))].sort();
  document.getElementById("secciones").replaceChildren(...secciones.map(s => el("option", { value: s })));
}

async function cargar() {
  try {
    ultimo = await api("/api/estado");
    pintar(); pintarRegistro(ultimo);
    document.getElementById("actualizado").textContent = `Actualizado ${hora(new Date().toISOString())}. Se refresca cada 20 s.`;
  } catch (e) {
    document.getElementById("actualizado").textContent = `Sin respuesta del panel: ${e.message}`;
  }
}

function avisar(texto, error = false) {
  const a = document.getElementById("aviso");
  a.textContent = texto; a.className = error ? "error" : "tenue";
}

document.getElementById("agregar").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const texto = document.getElementById("texto").value;
  try {
    const r = await api("/api/agregar", { texto, seccion: document.getElementById("seccion").value });
    const partes = [`${r.agregados} agregados`, r.repetidos && `${r.repetidos} ya estaban`, r.ya_bajados && `${r.ya_bajados} ya bajados`, r.sin_enlace && `${r.sin_enlace} renglones sin enlace`];
    avisar(partes.filter(Boolean).join(", ") + `. En cola: ${r.en_cola}.`);
    if (r.agregados) document.getElementById("texto").value = "";
    cargar();
  } catch (e) { avisar(e.message, true); }
});
document.getElementById("buscar").addEventListener("input", () => ultimo && pintarItems(ultimo));
cargar();
setInterval(() => { if (!document.hidden) cargar(); }, 20000);
</script>
</body>
</html>

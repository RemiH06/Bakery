[[caso]]
id = "doll-ssh-keygen"
repo = "30.Doll"
commit = "19324c7"
pruebas = ["tests/test_floppy.py"]
verificar = ["uv", "run", "pytest", "tests/test_floppy.py", "-x", "-q"]
tarea = """
Goal: `_ssh_keygen()` in `src/doll/floppy.py` can hang forever: inside an SSH session, Windows OpenSSH keeps reading
stdin. Give it a time limit and let the user pick another ssh-keygen binary.

Acceptance criteria:
- Module constant `TOPE_SSH = 30` (seconds). `_ssh_keygen` passes it as `timeout`; on timeout it raises
  `SystemExit` with a message that tells the user to set `ssh_keygen` in `[instalacion]` of `~/.doll/doll.toml`.
- `Instalacion` gets an optional field `ssh_keygen: str | None = None`, read by `instalacion()` from `[instalacion]`.
- `_ssh_keygen` takes the `Instalacion` as its first argument and uses `inst.ssh_keygen` when set, else the
  `ssh-keygen` on PATH. Update every caller.
File to touch: `src/doll/floppy.py`.
"""

# ---- 61.Tabularium ----

[[caso]]
id = "tab-hilos"
repo = "61.Tabularium"
commit = "4bedd59"
pruebas = ["tests/test_tesauro.py"]
verificar = ["uv", "run", "pytest", "tests/test_tesauro.py", "-x", "-q"]
tarea = """
Goal: with ten searches at once (the Raspberry Pi serves the page), search fails with IndexError. Two causes:
the Snowball stemmer keeps state in its instance, and `tesauro.indice()` (with `lru_cache`) gets built by several
threads at the same time.

Acceptance criteria:
- `src/tabularium/lexico.py`: the stemmer call in `_raiz` runs under a module-level `threading.Lock`. Keep the
  `lru_cache` on `_raiz`, so the lock is only taken for words not in the cache.
- `src/tabularium/tesauro.py`: `indice()` no longer uses `lru_cache`. The index lives in a module global
  `_indice` (None until built) and is built once per process under a lock; move the building code to a helper.
Files to touch: `src/tabularium/lexico.py`, `src/tabularium/tesauro.py`.
"""

[[caso]]
id = "tab-expandir"
repo = "61.Tabularium"
commit = "f422467"
pruebas = ["tests/test_lexico.py"]
verificar = ["uv", "run", "pytest", "tests/test_lexico.py::test_expandir_siglas", "-q"]
tarea = """
Goal: expand acronyms in a query with a reusable function, so other parts of the search can use it.

Acceptance criteria in `src/tabularium/lexico.py`:
- Add `"iva": "impuesto valor agregado"` to `SIGLAS`.
- New `expandir(texto: str) -> str`: the text with the expansions of its acronyms appended in parentheses,
  comma-separated, without repeats, in order of appearance. `"tasa del IVA"` gives
  `"tasa del IVA (impuesto valor agregado)"`. With no acronym, the text unchanged.
- `consulta()` uses `expandir` instead of its own inline expansion; its result is otherwise the same.
Only `test_expandir_siglas` is the check: `test_conjunto_de_evaluacion` in the same file fails for an unrelated
reason (it counts questions in a doc). Ignore it.
File to touch: `src/tabularium/lexico.py`.
"""

[[caso]]
id = "tab-modelo-candado"
repo = "61.Tabularium"
commit = "e272c6e"
pruebas = ["tests/test_pagina.py"]
verificar = ["uv", "run", "pytest", "tests/test_pagina.py", "-x", "-q"]
tarea = """
Goal: the public page loaded one copy of the embeddings model (~1 GB) per simultaneous question and the kernel
killed it. Load the model once, and limit how many questions are processed at the same time.

Acceptance criteria:
- `src/tabularium/vectores.py`: `modelo()` no longer uses `lru_cache`. It keeps the `Modelo` in a module global
  `_modelo` (None until loaded) and creates it once per process under a `threading.Lock`.
- `src/tabularium/pagina.py`: a module-level `_en_proceso = threading.BoundedSemaphore(2)` and `ESPERA = 30`
  (seconds). The POST handler of the question form acquires `_en_proceso` with `timeout=ESPERA` inside the thread
  that answers (search included) and always releases it. If it gets no turn, respond with status 503 and the page
  with the form and `<p>Hay muchas preguntas en este momento; intenta en un momento.</p>`.
Files to touch: `src/tabularium/vectores.py`, `src/tabularium/pagina.py`.
"""

# llama-swap del nodo de modelos: un endpoint compatible con OpenAI en 127.0.0.1:8090; el campo `model`
# de cada llamada decide qué llama-server arranca (uno a la vez, la VRAM no da para dos).
# El mismo archivo sirve en Windows y Linux: corre desde ~/bakers (lo deja así el setup de cada plataforma,
# en windows/ o debian/), por eso las rutas de modelos son relativas. Se recarga solo al editarlo.
# Los números de VRAM y tok/s de los comentarios son de Pixilate (RTX 3060 12 GB, 48 GB de RAM).

healthCheckTimeout: 300  # Qwen pesa 22 GB: cargarlo desde disco tarda
logLevel: info
startPort: 10001         # puertos internos de cada llama-server, solo loopback
sendLoadingState: false  # el estado de carga se inyecta como texto y rompería el JSON forzado

# Sin llave no responde. Los valores viven en ~/bakers/api-key.txt (Aerilate) y api-key-pi.txt
# (frambuesa-yi), nunca en el repo; el setup los genera y los pasa como variables de entorno.
apiKeys:
  - "${env.BAKERS_API_KEY}"
  - "${env.BAKERS_API_KEY_PI}"

# Marchas: los Bakers piden el ID virtual `principal` y el perfil activo decide qué modelo lo atiende.
# vigilante.py cambia de perfil según la VRAM libre; al arrancar (o recargar) se empieza en `alta`.
hooks:
  on_startup:
    profile: "alta"

profiles:
  "alta":
    description: "GPU libre: Bonsai completo en VRAM"
    pins:
      "principal": "bonsai"
  "media":
    description: "Algo más usa la GPU (un juego): Qwen con expertos en RAM"
    pins:
      "principal": "qwen"
  "ninguna":
    description: "Ni Qwen cabe: los Bakers responden error y Claude delega en otro lado"
    pins:
      "principal": ~

macros:
  # Binarios: cambian de ruta y extensión por plataforma, así que los pone el setup de cada una como variable de
  # entorno. Si falta una, llama-swap no carga la configuración (mejor que arrancar a medias).
  "llama": "${env.BAKERS_LLAMA_SERVER}"     # llama.cpp oficial con CUDA
  "prism": "${env.BAKERS_PRISM_SERVER}"     # fork de PrismML, para los Bonsai ternarios (PQ2_0)
  "whisper": "${env.BAKERS_WHISPER_SERVER}" # whisper-server de whisper.cpp
  # Contexto de 32k en un solo slot (con -np auto se reparte entre varios), sin pensar:
  # un Baker es una función de un paso y el razonamiento solo gasta tiempo.
  "comunes": "--host 127.0.0.1 --port ${PORT} -c 32768 -np 1 -fa on --reasoning off --no-webui"

models:
  # Principal: 7.9 GB de VRAM, 36 tok/s (medido en 1.0a). Pide el fork de PrismML.
  "bonsai":
    name: "Ternary Bonsai 2 27B PQ2_0"
    cmd: |
      ${prism} ${comunes}
      -m models/Ternary-Bonsai-2-27B-PQ2_0.gguf -ngl 99
    ttl: 600  # se descarga tras 10 min sin uso y deja la GPU libre

  # Respaldo y primera marcha baja: todos los expertos en RAM, 3.9 GB de VRAM, 19 tok/s.
  # Con los expertos en RAM, leer el prompt es el cuello: con el -ub de 512 por defecto lee a 120 tok/s;
  # -ub 2048 sube a ~390 por 0.25 GB más de VRAM (medido en 1.0l, 2026-10-28).
  "qwen":
    name: "Qwen3.6 35B-A3B UD-Q4_K_XL"
    cmd: |
      ${llama} ${comunes}
      -m models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf -ngl 99 -ncmoe 99 -b 2048 -ub 2048
    ttl: 600

  # Qwen3.6 sin rechazos (abliterado por huihui-ai, Apache 2.0): fuera de las marchas, se pide por nombre.
  # Mismo reparto que `qwen`, ~17.6 tok/s. El GGUF trae capas MTP, pero con los expertos en RAM
  # `--spec-type draft-mtp` baja a 8.7 tok/s (acepta 31 % del borrador): apagado (medido el 2026-10-27).
  # Agente de código (Qwen Code) y chats largos: 128k propios (el último -c gana sobre el de `comunes`)
  # y -ub 4096, que lee a ~510 a 590 tok/s (128k en 4.3 min). ~6.9 GB de VRAM (medido en 1.0l).
  "abliterado":
    name: "Huihui Qwen3.6 35B-A3B abliterated Q4_K, 128k"
    cmd: |
      ${llama} ${comunes}
      -m models/Huihui-Qwen3.6-35B-A3B-abliterated-Q4_K.gguf -ngl 99 -ncmoe 99
      -c 131072 -b 4096 -ub 4096
    ttl: 600

  # Bonsai abliterado (huihui-ai, capas 22 a 52; el autor lo marca "test/validation"). Pide el fork de
  # PrismML. Entero en VRAM: 64k con la caché KV en q8_0 ocupa ~8.9 GB (en f16 llega a 10.8 y no deja
  # margen). Lee a ~480 tok/s y genera a 26 con el contexto lleno (medido en 1.0l).
  "bonsai-abliterado":
    name: "Huihui Ternary Bonsai 27B abliterated PQ2_0, 64k"
    cmd: |
      ${prism} ${comunes}
      -m models/Huihui-Qwen3.8-27B-abliterated-Ternary-Bonsai-PQ2_0.gguf -ngl 99
      -c 65536 -ctk q8_0 -ctv q8_0
    ttl: 600

  # `abliterado` con su propio proyector de visión, para reels que `vision` se niega a describir.
  # --no-op-offload como en `vision`: 8 fotogramas se leen en ~37 s en vez de ~68 (1.0n).
  "vision-abliterado":
    name: "Huihui Qwen3.6 35B-A3B abliterated Q4_K + mmproj F16"
    cmd: |
      ${llama} ${comunes}
      -m models/Huihui-Qwen3.6-35B-A3B-abliterated-Q4_K.gguf -ngl 99 -ncmoe 99 --no-op-offload
      --mmproj models/mmproj-Huihui-Qwen3.6-35B-A3B-abliterated-F16.gguf
    ttl: 600

  # Qwen con 24 capas de expertos en RAM y el resto en VRAM: ~11.2 GB, ~26 tok/s (1.0a). Para el A/B
  # contra `bonsai`; no cabe junto a nada más.
  "qwen-gpu":
    name: "Qwen3.6 35B-A3B UD-Q4_K_XL, -ncmoe 24"
    cmd: |
      ${llama} ${comunes}
      -m models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf -ngl 99 -ncmoe 24
    ttl: 600

  # A/B de 1.0q, fuera de las marchas. Gemma 4 26B-A4B en el QAT Q4_0 oficial de Google (Apache 2.0,
  # 14.4 GB): no cabe en VRAM, va con los expertos en RAM como `qwen`. Contra `bonsai-abliterado` en chat.
  "gemma":
    name: "Gemma 4 26B-A4B QAT Q4_0"
    cmd: |
      ${llama} ${comunes}
      -m models/gemma-4-26B_q4_0-it.gguf -ngl 99 -ncmoe 99 -b 2048 -ub 2048
    ttl: 600

  # Rocinante X 12B v1b (TheDrummer, base Mistral Nemo, Q4_K_M 7.5 GB): entero en VRAM. Para hojas de compañía.
  "rocinante":
    name: "Rocinante X 12B v1b Q4_K_M"
    cmd: |
      ${llama} ${comunes}
      -m models/Rocinante-X-12B-v1b-Q4_K_M.gguf -ngl 99
    ttl: 600

  # Baker `reel`: transcribe y ve. No pasan por las marchas (el gateway se niega en `ninguna`).
  # large-v3-turbo q8_0, ~1.5 GB de VRAM. Las rutas imitan /v1/audio/transcriptions de OpenAI.
  "whisper":
    name: "whisper.cpp large-v3-turbo q8_0"
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /v1/audio/transcriptions/
    cmd: |
      ${whisper} --host 127.0.0.1 --port ${PORT} -l auto
      -m models/ggml-large-v3-turbo-q8_0.bin --request-path /v1/audio/transcriptions --inference-path ""
    ttl: 600

  # El mismo Qwen de `qwen` más su proyector de visión (0.9 GB): ~4.7 GB de VRAM.
  # Cada imagen se decodifica en su propio lote y llama.cpp copia los expertos de RAM a la GPU en cada
  # lote de 32 tokens o más: con --no-op-offload se calculan en CPU y 8 fotogramas se leen en ~34 s
  # en vez de ~63, con la misma lectura. -ub 2048 no ayuda aquí (1.0n, 2026-10-28). En `qwen` no
  # conviene: el texto entra en lotes grandes, donde la copia sí paga.
  "vision":
    name: "Qwen3.6 35B-A3B UD-Q4_K_XL + mmproj F16"
    cmd: |
      ${llama} ${comunes}
      -m models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf -ngl 99 -ncmoe 99 --no-op-offload
      --mmproj models/mmproj-Qwen3.6-35B-A3B-F16.gguf
    ttl: 600

# Los modelos fuera de un grupo se turnan entre sí (uno a la vez). `reel` deja a whisper y vision
# cargados juntos durante un lote y, al ser exclusivo, descarga a bonsai o qwen mientras tanto.
groups:
  "reel":
    swap: false
    exclusive: true
    members: ["whisper", "vision"]
